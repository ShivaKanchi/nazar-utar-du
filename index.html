<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3e7d2" />
    <title>Nazar Na Lagey</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3e7d2;
        --ink: #3b2418;
        --maroon: #8e241e;
        --gold: #b88239;
        --mx: 0;
        --my: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        color: var(--ink);
        background: #e8d2ad;
      }
      .app {
        position: relative;
        width: 100vw;
        height: 100svh;
        min-height: 360px;
        overflow: hidden;
        isolation: isolate;
        background: radial-gradient(
          ellipse at center,
          #fff2d8 0,
          #e9d2ac 68%,
          #c7a16e 100%
        );
      }
      .art-stage {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        transform: scale(1.16);
        transform-origin: center;
        pointer-events: none;
      }
      .scene-bg {
        position: absolute;
        left: 50%;
        top: 51.02%;
        width: 87.38vh;
        height: 87.32vw;
        object-fit: fill;
        z-index: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) rotate(-90deg);
        translate: var(--bgx, 0px) var(--bgy, 0px);
        transition: translate 0.1s linear;
        will-change: translate;
        filter: drop-shadow(0 8px 22px #805c3224);
      }
      .preview-window {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(49.2vw, 100.2667vh);
        height: auto;
        aspect-ratio: 16 / 9;
        transform: translate(-50%, -50%);
        z-index: 1;
        overflow: hidden;
        border-radius: 14px;
        background: #f6e9d2;
        box-shadow: 0 5px 24px #5e371e16;
        pointer-events: auto;
      }
      .preview-window iframe,
      .photo-preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: inherit;
        object-fit: contain;
        background: #f6e9d2;
      }
      .photo-preview {
        display: block;
      }
      #preview[hidden],
      .photo-preview[hidden] {
        display: none;
      }
      .ornament {
        position: absolute;
        display: block;
        object-fit: fill;
        z-index: 2;
        pointer-events: none;
        will-change: transform;
        transform: translate3d(var(--offset-x, 0px), var(--offset-y, 0px), 0)
          scaleX(var(--flip, 1)) rotate(var(--rotation, 0deg));
        transform-origin: center;
        transition: transform 0.08s linear;
        user-select: none;
        -webkit-user-drag: none;
      }
      .ornament.awaiting-entrance {
        opacity: 0;
      }
      .ornament.entering {
        animation: ornament-arrive 0.82s cubic-bezier(0.16, 0.78, 0.26, 1)
          var(--enter-delay, 0ms) both;
      }
      @keyframes ornament-arrive {
        from {
          opacity: 0;
          translate: var(--enter-x, 0) var(--enter-y, 0);
          scale: 0.86;
        }
        to {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }
      .ritual-console {
        position: absolute;
        z-index: 76;
        left: 25.4%;
        top: 22.2%;
        width: 49.2%;
        height: 56.4%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(7px, 1.2vh, 12px);
        padding: clamp(12px, 2.1vh, 22px) clamp(12px, 2vw, 24px);
        border: 1px solid #d3ad76;
        border-radius: 14px;
        background: linear-gradient(150deg, #fff8ebf5, #f2e0c6f2);
        box-shadow: 0 15px 44px #4c2b1f55;
        backdrop-filter: blur(7px);
        color: #40291b;
        text-align: center;
      }
      .ritual-kicker {
        margin: 0;
        color: #99602f;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .ritual-console h1 {
        margin: 0;
        font:
          600 clamp(19px, 2.1vw, 28px) Georgia,
          serif;
      }
      .ritual-intro {
        margin: 0;
        color: #87694c;
        font-size: 11px;
      }
      .source-row {
        display: flex;
        gap: 6px;
        width: 100%;
      }
      .url-input {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 10px;
        border: 1px solid #dac6a7;
        border-radius: 6px;
        outline: 0;
        background: #fffcf6;
        color: #42291a;
        font:
          12px "Segoe UI",
          sans-serif;
      }
      .url-input::placeholder {
        color: #a58766;
      }
      .photo-picker {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 11px;
        border: 1px solid #ccb08b;
        border-radius: 6px;
        background: #f7ecd9;
        color: #714b2d;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      .ritual-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .ritual-choice {
        position: relative;
        min-width: 0;
        cursor: pointer;
      }
      .ritual-choice input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .ritual-choice-body {
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 5px;
        border: 1px solid #dac8ab;
        border-radius: 7px;
        background: #fff9ef;
        color: #68462c;
        transition:
          background 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .ritual-choice input:checked + .ritual-choice-body {
        border-color: #a34029;
        background: #f7e4c7;
        box-shadow: inset 0 0 0 1px #a3402933;
        transform: translateY(-1px);
      }
      .ritual-icon {
        font-size: 20px;
      }
      .ritual-choice-text {
        min-width: 0;
        text-align: left;
      }
      .ritual-choice strong {
        display: block;
        font-size: 10px;
        line-height: 1.1;
      }
      .ritual-choice small {
        display: block;
        margin-top: 2px;
        color: #97734e;
        font-size: 8px;
        line-height: 1.1;
      }
      .ritual-note {
        min-height: 14px;
        margin: 0;
        color: #82674c;
        font-size: 9px;
      }
      .screenshot-consent {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
        color: #77634d;
        font-size: 8px;
        line-height: 1.35;
      }
      .screenshot-consent input {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        margin: 1px 0 0;
        accent-color: #952f24;
      }
      .ritual-submit {
        height: 38px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 7px;
        background: #962e25;
        color: #fff4de;
        font:
          600 12px "Segoe UI",
          sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 10px #8c332333;
        transition:
          transform 0.18s,
          filter 0.18s;
      }
      .ritual-submit:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }
      .form-error {
        min-height: 13px;
        margin: 0;
        color: #a12b24;
        font-size: 9px;
      }
      .ritual-console[hidden],
      .ritual-animation[hidden],
      .screenshot-action[hidden],
      .screenshot-preview[hidden] {
        display: none !important;
      }
      .screenshot-preview {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #f6e9d2;
      }
      .screenshot-action {
        position: absolute;
        z-index: 76;
        left: 50%;
        top: 75%;
        transform: translateX(-50%);
        max-width: 90%;
        padding: 7px 12px;
        border: 1px solid #b77a46;
        border-radius: 99px;
        background: #fff7e8;
        color: #60351f;
        font:
          600 10px "Segoe UI",
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 4px 16px #44281935;
      }
      .ritual-animation {
        position: absolute;
        z-index: 78;
        left: 25.4%;
        top: 22.2%;
        width: 49.2%;
        height: 56.4%;
        display: none;
        place-content: center;
        justify-items: center;
        gap: 10px;
        overflow: hidden;
        padding: 18px;
        border: 1px solid #f0d29c;
        border-radius: 15px;
        background: radial-gradient(
          ellipse at center,
          #a5512fef,
          #4d241fef 74%
        );
        color: #fff1d5;
        text-align: center;
        box-shadow: 0 10px 35px #32171072;
      }
      .ritual-animation.active {
        display: grid;
        animation: ritual-in 0.35s ease-out both;
      }
      .ritual-animation p {
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f4d3a2;
      }
      .ritual-animation h2 {
        margin: 0;
        font:
          600 clamp(17px, 2vw, 24px) Georgia,
          serif;
      }
      .ritual-media {
        display: none;
        max-width: min(280px, 72%);
        max-height: 62%;
        object-fit: contain;
        border-radius: 9px;
        box-shadow: 0 6px 22px #21100e65;
      }
      .ritual-media.visible {
        display: block;
      }
      .ritual-gif {
        width: min(300px, 74%);
        max-height: 60%;
        object-fit: contain;
      }
      .ritual-tika {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%, #68543c, #17110d 63%);
        box-shadow: 0 0 0 0 #ffce7666;
        animation: tika-pulse 0.75s ease-out 2;
      }
      .done-stamp {
        display: none;
        font:
          700 clamp(22px, 3.2vw, 38px) Georgia,
          serif;
        color: #ffe2a6;
        text-shadow:
          0 2px 0 #6b261b,
          0 0 18px #ffb65088;
        animation: stamp-in 0.5s cubic-bezier(0.17, 0.8, 0.26, 1.4) both;
      }
      .ritual-animation.done .ritual-media,
      .ritual-animation.done .ritual-tika,
      .ritual-animation.done .ritual-caption {
        display: none;
      }
      .ritual-animation.done .done-stamp {
        display: block;
      }
      .confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 25%, #ffdc76 0 3px, transparent 4px),
          radial-gradient(circle at 79% 28%, #f37b4d 0 3px, transparent 4px),
          radial-gradient(circle at 35% 75%, #9dc47c 0 3px, transparent 4px),
          radial-gradient(circle at 69% 68%, #ffdc76 0 3px, transparent 4px);
        animation: confetti 0.8s ease-in-out infinite alternate;
      }
      @keyframes ritual-in {
        from {
          opacity: 0;
          scale: 0.9;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes tika-pulse {
        to {
          box-shadow: 0 0 0 18px #ffce7600;
          transform: scale(1.15);
        }
      }
      @keyframes stamp-in {
        from {
          opacity: 0;
          scale: 0.3;
          rotate: -8deg;
        }
        to {
          opacity: 1;
          scale: 1;
          rotate: 0;
        }
      }
      @keyframes confetti {
        to {
          translate: 0 -7px;
          rotate: 4deg;
        }
      }
      .hidden {
        display: none !important;
      }
      .status {
        position: absolute;
        z-index: 77;
        top: 76%;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 11px;
        border: 1px solid #d0a968;
        border-radius: 20px;
        background: #44291de8;
        color: #fff0d5;
        font-size: 10px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .status.show {
        opacity: 1;
      }
      .grain {
        position: absolute;
        inset: 0;
        z-index: 90;
        opacity: 0.08;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
      }
      @media (max-width: 760px) {
        .preview-window {
          width: min(62vw, 88.89vh);
        }
      }
      @media (max-width: 480px) {
        .preview-window {
          width: min(66vw, 80vh);
        }
        .status {
          top: 68%;
        }
      }
      @media (max-width: 760px) {
        .ritual-console,
        .ritual-animation {
          left: 19%;
          top: 23%;
          width: 62%;
          height: 50%;
        }
        .screenshot-action {
          top: 68%;
        }
        .ritual-console {
          gap: 5px;
          padding: 9px 10px;
        }
        .ritual-kicker {
          font-size: 8px;
        }
        .ritual-console h1 {
          font-size: 20px;
        }
        .ritual-intro {
          font-size: 9px;
        }
        .ritual-choice-body {
          height: 46px;
          gap: 3px;
          padding: 3px;
        }
        .ritual-icon {
          font-size: 17px;
        }
        .ritual-choice strong {
          font-size: 8px;
        }
        .ritual-choice small {
          font-size: 7px;
        }
        .ritual-note {
          font-size: 8px;
        }
        .screenshot-consent {
          font-size: 7px;
        }
        .ritual-submit {
          height: 33px;
          font-size: 11px;
        }
      }
      @media (max-width: 480px) {
        .ritual-console,
        .ritual-animation {
          left: 12%;
          top: 22%;
          width: 76%;
          height: 56%;
          gap: 4px;
          padding: 8px;
        }
        .ritual-console h1 {
          font-size: 18px;
        }
        .ritual-intro {
          font-size: 8px;
        }
        .ritual-choice-body {
          height: 44px;
        }
        .ritual-icon {
          font-size: 16px;
        }
        .ritual-choice strong {
          font-size: 8px;
        }
        .ritual-choice small {
          display: none;
        }
        .ritual-note {
          font-size: 7px;
        }
        .screenshot-consent {
          font-size: 7px;
        }
        .ritual-submit {
          height: 31px;
        }
        .ritual-media {
          max-width: 82%;
        }
      }
      .ritual-console {
        left: 50%;
        top: 50%;
        width: min(560px, calc(100vw - 28px));
        height: auto;
        max-height: calc(100svh - 28px);
        transform: translate(-50%, -50%);
        gap: 9px;
        padding: clamp(12px, 1.5vw, 20px);
        overflow: auto;
      }
      .ritual-console h1 {
        font-size: clamp(19px, 2vw, 27px);
      }
      .ritual-intro {
        font-size: 11px;
      }
      .ritual-choice-body {
        height: 52px;
      }
      .ritual-choice strong {
        font-size: 10px;
      }
      .ritual-choice small {
        font-size: 8px;
      }
      .ritual-note {
        font-size: 9px;
      }
      .screenshot-consent {
        font-size: 9px;
      }
      .ritual-submit {
        height: 38px;
      }
      .ritual-animation {
        left: 50%;
        top: 50%;
        width: min(560px, calc(100vw - 28px));
        height: min(460px, calc(100svh - 28px));
        transform: translate(-50%, -50%);
      }
      .screenshot-action {
        top: 80%;
      }
      .screenshot-consent[hidden],
      #technique-step[hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        .art-stage {
          transform: scale(1.11);
        }
        .ritual-console {
          width: min(500px, calc(100vw - 24px));
          gap: 6px;
          padding: 12px;
        }
        .ritual-choice-body {
          height: 48px;
        }
        .ritual-animation {
          width: min(500px, calc(100vw - 24px));
          height: min(420px, calc(100svh - 24px));
        }
      }
      @media (max-width: 480px) {
        .ritual-console {
          width: calc(100vw - 20px);
          gap: 5px;
          padding: 10px;
        }
        .ritual-console h1 {
          font-size: 18px;
        }
        .ritual-intro {
          font-size: 9px;
        }
        .ritual-choice-body {
          height: 44px;
          padding: 4px;
        }
        .ritual-choice strong {
          font-size: 8px;
        }
        .ritual-choice small {
          font-size: 7px;
        }
        .ritual-note {
          font-size: 8px;
        }
        .screenshot-consent {
          font-size: 8px;
        }
        .ritual-animation {
          width: calc(100vw - 20px);
          height: min(370px, calc(100svh - 20px));
        }
      }
      .intro-screen {
        position: absolute;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 35%,
          #1839cf,
          #1028a6 48%,
          #091677
        );
        color: #f7f4ff;
        animation: intro-in 0.75s cubic-bezier(0.2, 0.9, 0.25, 1.3) both;
        transition:
          opacity 0.72s cubic-bezier(0.7, 0, 0.2, 1),
          transform 0.82s cubic-bezier(0.68, -0.35, 0.25, 1.3);
      }
      .intro-screen.leaving {
        opacity: 0;
        transform: translateY(-105%) scale(0.92);
        pointer-events: none;
      }
      .intro-eye {
        position: relative;
        display: grid;
        place-items: center;
        gap: 13px;
        text-align: center;
      }
      .intro-eye img {
        width: clamp(145px, 22vmin, 290px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 40px #74c7ff99);
        animation: eye-elastic 1.2s cubic-bezier(0.34, 1.72, 0.42, 1) both;
      }
      .intro-eye p {
        margin: 0;
        color: #d9e6ff;
        font:
          500 clamp(14px, 1.5vw, 19px) Georgia,
          serif;
        letter-spacing: 0.04em;
      }
      .source-band {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: min(790px, calc(100vw - 28px));
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border: 1px solid #a9c9ff77;
        border-radius: 10px;
        background: #071250e8;
        box-shadow: 0 16px 44px #030a4e66;
        backdrop-filter: blur(12px);
        transform: translateX(-50%);
      }
      .source-band-title {
        grid-column: 1/-1;
        margin: 0 0 1px;
        color: #e6eeff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .source-band .url-input {
        height: 42px;
        border-color: #708bd7;
        background: #f8faff;
        font-size: 13px;
      }
      .source-band .photo-picker {
        height: 42px;
        border-color: #8ca7e3;
        background: #253c9c;
        color: #fff;
      }
      .source-go {
        height: 42px;
        padding: 0 18px;
        border: 1px solid #ffd678;
        border-radius: 6px;
        background: #f0bd59;
        color: #25204c;
        font:
          700 12px "Segoe UI",
          sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      .privacy-note {
        grid-column: 1/-1;
        margin: 0;
        color: #c2d1ff;
        font-size: 9px;
        text-align: center;
      }
      .intro-hint {
        position: absolute;
        right: 16px;
        bottom: 142px;
        margin: 0;
        color: #d6e2ff;
        font-size: 10px;
      }
      .frame-message {
        position: absolute;
        z-index: 4;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #fff4dfd9;
        color: #765431;
        font:
          500 12px "Segoe UI",
          sans-serif;
        text-align: center;
      }
      .frame-message[hidden] {
        display: none !important;
      }
      .preview-window.target-visible {
        visibility: visible;
        animation: target-arrive 0.8s cubic-bezier(0.16, 0.8, 0.26, 1.28) both;
      }
      .ritual-band {
        position: absolute;
        z-index: 76;
        left: 50%;
        bottom: 12px;
        width: min(780px, calc(100vw - 22px));
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px;
        border: 1px solid #b4864d;
        border-radius: 11px;
        background: #fff5e5ee;
        box-shadow: 0 8px 26px #3b201b55;
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translate(-50%, 24px);
        pointer-events: none;
        transition:
          opacity 0.35s,
          transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.2);
      }
      .ritual-band.visible {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .ritual-band.busy {
        filter: saturate(0.72);

    <script src="assets/mandap-layout.js"></script>
    <script>
      (() => {
        const app = document.querySelector("#app"),
          artStage = document.querySelector("#art-stage"),
          previewWindow = document.querySelector("#preview-window"),
          placementLayer = document.querySelector("#ritual-placement-layer"),
          preview = document.querySelector("#preview"),
          photo = document.querySelector("#photo-preview"),
          shot = document.querySelector("#screenshot-preview"),
          frameMessage = document.querySelector("#frame-message"),
          form = document.querySelector("#ritual-form"),
          loader = document.querySelector("#loading-track"),
          input = document.querySelector("#url-input"),
          photoInput = document.querySelector("#photo-input"),
          photoPicker = document.querySelector("#photo-picker"),
          intro = document.querySelector("#intro-screen"),
          band = document.querySelector("#ritual-band"),
          animation = document.querySelector("#ritual-animation"),
          gif = document.querySelector("#ritual-gif"),
          peopleEnsemble = document.querySelector("#people-ensemble"),
          status = document.querySelector("#status");
        for (let index = 1; index <= 12; index++) {
          const person = new Image();
          person.src = `assets/people-${index}.png`;
          person.alt = "";
          person.draggable = false;
          person.style.setProperty("--arrival-delay", `${(index - 1) * 85}ms`);
          person.style.setProperty("--exit-delay", `${(12 - index) * 75}ms`);
          peopleEnsemble.append(person);
        }
        const rendered = [],
          layout = readLayout();
        let photoUrl = "",
          selectedFile = null,
          websiteUrl = null,
          iframeLoaded = false,
          shotRequested = false,
          ritualBusy = false,
          peopleOnStage = false,
          placementKind = "",
          toastTimer,
          iframeTimer,
          iframeCheckTimer,
          contentReadyTimer,
          resolveContentReady = null,
          frame = 0;
        const bellAudio = new Audio("sound/bell-sound.mp3");
        bellAudio.preload = "auto";
        function readLayout() {
          try {
            const fallback = window.NAZAR_DEFAULT_LAYOUT,
              match = location.hash.match(/^#layout=([A-Za-z0-9_-]+)$/);
            if (!match) return fallback;
            const encoded = match[1].replace(/-/g, "+").replace(/_/g, "/"),
              parsed = JSON.parse(decodeURIComponent(escape(atob(encoded))));
            if (
              parsed.version !== 1 ||
              !Array.isArray(parsed.items) ||
              parsed.items.length > 120
            )
              return fallback;
            const valid = parsed.items.filter(
              (item) =>
                window.NAZAR_ASSET_NAMES.includes(item.name) &&
                ["x", "y", "w", "h", "rotation", "depth"].every((key) =>
                  Number.isFinite(Number(item[key])),
                ) &&
                Number(item.w) > 0 &&
                Number(item.h) > 0,
            );
            return valid.length ? valid : fallback;
          } catch {
            return window.NAZAR_DEFAULT_LAYOUT;
          }
        }
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        function finishContentReady(ready) {
          clearTimeout(contentReadyTimer);
          if (resolveContentReady) {
            resolveContentReady(ready);
            resolveContentReady = null;
          }
        }
        function playBellSound() {
          bellAudio.currentTime = 0;
          void bellAudio.play().catch(() => {});
        }
        function ringBell(event) {
          event.stopPropagation();
          const bell = event.currentTarget;
          bell.classList.remove("bell-ringing");
          void bell.offsetWidth;
          bell.classList.add("bell-ringing");
          clearTimeout(bell.ringTimer);
          bell.ringTimer = setTimeout(
            () => bell.classList.remove("bell-ringing"),
            1250,
          );
          playBellSound();
        }
        const say = (message) => {
          status.textContent = message;
          status.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => status.classList.remove("show"), 4200);
        };
        const parseUrl = (value) => {
          let raw = value.trim();
          if (!raw) return null;
          if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
          try {
            const url = new URL(raw);
            return ["http:", "https:"].includes(url.protocol) &&
              !url.username &&
              !url.password
              ? url
              : null;
          } catch {
            return null;
          }
        };
        const safeForScreenshot = (url) => {
          const host = url.hostname.toLowerCase(),
            local =
              host === "localhost" ||
              host === "0.0.0.0" ||
              host === "[::1]" ||
              host.startsWith("[fe80:") ||
              host.endsWith(".localhost") ||
              host.endsWith(".local") ||
              host.endsWith(".internal") ||
              host.endsWith(".lan") ||
              host.startsWith("127.") ||
              host.startsWith("10.") ||
              host.startsWith("192.168.") ||
              host.startsWith("169.254.") ||
              /^172\.(1[6-9]|2\d|3[01])\./.test(host),
            secretKey = (key) =>
              [
                "token",
                "accesstoken",
                "refreshtoken",
                "idtoken",
                "secret",
                "session",
                "sessionid",
                "password",
                "auth",
                "authorization",
                "apikey",
                "accesskey",
                "code",
              ].includes(key.toLowerCase().replace(/[^a-z0-9]/g, "")),
            secret =
              [...url.searchParams.keys()].some(secretKey) ||
              /(token|secret|session|password|auth|api.?key|access.?key)/i.test(
                url.hash,
              );
          return !local && !secret;
        };
        function createScreenshot() {
          if (shotRequested || !websiteUrl) return;
          if (!safeForScreenshot(websiteUrl)) {
            frameMessage.hidden = true;
            say("Showing the link in its live frame.");
            finishContentReady(true);
            return;
          }
          shotRequested = true;
          frameMessage.hidden = false;
          frameMessage.textContent =
            "This site’s frame is protected or unavailable. Making a screenshot…";
          say(
            "This public link cannot be verified in its frame; making a screenshot fallback.",
          );
          shot.onload = () => {
            preview.hidden = true;
            photo.hidden = true;
            shot.hidden = false;
            frameMessage.hidden = true;
            shot.classList.remove("screenshot-arrive");
            void shot.offsetWidth;
            shot.classList.add("screenshot-arrive");
            say("Website preview is ready.");
            finishContentReady(true);
          };
          shot.onerror = () => {
            frameMessage.textContent =
              "The screenshot service could not render this site.";
            say("Screenshot fallback could not render this site.");
            shotRequested = false;
            finishContentReady(false);
          };
          shot.src = `https://image.thum.io/get/width/1280/crop/720/noanimate/${websiteUrl.href}`;
        }
        function inspectFrame() {
          if (!websiteUrl) return;
          let blank = false;
          try {
            const href = preview.contentWindow.location.href,
              doc = preview.contentDocument;
            blank =
              href === "about:blank" ||
              href.startsWith("chrome-error:") ||
              !doc?.body ||
              (!doc.body.textContent.trim() &&
                !doc.body.querySelector("img,video,canvas,svg,iframe"));
          } catch {
            createScreenshot();
            return;
          }
          if (blank) createScreenshot();
          else {
            frameMessage.hidden = true;
            say("Your website is showing in its live frame.");
            finishContentReady(true);
          }
        }
        preview.addEventListener("load", () => {
          if (!websiteUrl) return;
          iframeLoaded = true;
          clearTimeout(iframeTimer);
          clearTimeout(iframeCheckTimer);
          iframeCheckTimer = setTimeout(inspectFrame, 900);
        });
        preview.addEventListener("error", () => {
          if (websiteUrl) createScreenshot();
        });
        const ornaments = [];
        layout.forEach((item, index) => {
          const img = document.createElement("img");
          img.className = `ornament awaiting-entrance asset-${item.name}`;
          if (item.name === "bell-1" || item.name === "bell-2") {
            img.classList.add("interactive-bell");
            img.tabIndex = 0;
            img.setAttribute("role", "button");
            img.setAttribute("aria-label", "Ring the bell");
            img.title = "Click to ring";
            img.addEventListener("click", ringBell);
            img.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                ringBell(event);
              }
            });
          }
          img.src = `assets/${item.name}.png`;
          img.alt = "";
          img.draggable = false;
          img.style.left = `${item.x}%`;
          img.style.top = `${item.y}%`;
          img.style.width = `${item.w}%`;
          img.style.height = `${item.h}%`;
          img.style.setProperty("--flip", item.flip ? -1 : 1);
          img.style.setProperty("--rotation", `${item.rotation || 0}deg`);
          img.dataset.depth = String(item.depth || 0.8);
          img.style.setProperty("--sway-delay", `-${(index % 7) * 0.7}s`);
          img.dataset.asset = item.name;
          img.style.zIndex = String(index + 3);
          artStage.append(img);
          ornaments.push({ item, img, index });
        });
        function entranceGroups() {
          const unused = new Set(ornaments.map((entry) => entry.item.id)),
            groups = [];
          for (const entry of ornaments) {
            if (!unused.has(entry.item.id)) continue;
            unused.delete(entry.item.id);
            const a = entry.item,
              cx = a.x + a.w / 2,
              cy = a.y + a.h / 2,
              mirror = ornaments.find(
                (other) =>
                  unused.has(other.item.id) &&
                  other.item.name === a.name &&
                  Math.abs(other.item.x + other.item.w / 2 + cx - 100) < 5.5 &&
                  Math.abs(other.item.y + other.item.h / 2 - cy) < 3 &&
                  Math.abs(other.item.w - a.w) < 2 &&
                  Math.abs(other.item.h - a.h) < 2,
              ),
              members = [entry];
            if (mirror) {
              unused.delete(mirror.item.id);
              members.push(mirror);
            }
            if (a.name === "toran-3" && a.y < 5) {
              for (const other of ornaments)
                if (
                  unused.has(other.item.id) &&
                  other.item.name === "toran-3" &&
                  Math.abs(other.item.y - a.y) < 1 &&
                  Math.abs(other.item.h - a.h) < 1
                ) {
                  unused.delete(other.item.id);
                  members.push(other);
                }
            }
            const x =
                members.reduce(
                  (sum, value) => sum + value.item.x + value.item.w / 2,
                  0,
                ) / members.length,
              y =
                members.reduce(
                  (sum, value) => sum + value.item.y + value.item.h / 2,
                  0,
                ) / members.length;
            let fromX = "0",
              fromY = "0";
            if (y < 36) fromY = "-105vh";
            else if (y > 64) fromY = "105vh";
            else if (x < 43) fromX = "-105vw";
            else if (x > 57) fromX = "105vw";
            else fromY = y < 50 ? "-105vh" : "105vh";
            groups.push({
              members,
              index: Math.min(...members.map((value) => value.index)),
              fromX,
              fromY,
            });
          }
          return groups.sort((a, b) => a.index - b.index);
        }
        async function animateMandapEntrance() {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
            ornaments.forEach(({ img }) =>
              img.classList.remove("awaiting-entrance"),
            );
            return;
          }
          await Promise.all(
            entranceGroups().map(async (group, index) => {
              await Promise.all(
                group.members.map(({ img }) =>
                  typeof img.decode === "function"
                    ? img.decode().catch(() => {})
                    : Promise.resolve(),
                ),
              );
              await wait(index * 22);
              const finished = Promise.all(
                group.members.map(
                  ({ img }) =>
                    new Promise((resolve) =>
                      img.addEventListener("animationend", resolve, {
                        once: true,
                      }),
                    ),
                ),
              );
              group.members.forEach(({ img }) => {
                img.style.setProperty("--enter-x", group.fromX);
                img.style.setProperty("--enter-y", group.fromY);
                img.classList.remove("awaiting-entrance");
                img.classList.add("entering");
              });
              await finished;
              group.members.forEach(({ img }) => {
                img.classList.remove("entering");
                img.style.removeProperty("--enter-x");
                img.style.removeProperty("--enter-y");
              });
            }),
          );
        }
        input.addEventListener("input", () => {
          if (input.value.trim()) {
            selectedFile = null;
            photoInput.value = "";
            photoPicker.setAttribute("aria-label", "Upload a photo");
            photoPicker.title = "Upload a photo";
          }
        });
        photoInput.addEventListener("change", () => {
          selectedFile = photoInput.files[0] || null;
          if (selectedFile) {
            input.value = "";
            photoPicker.setAttribute(
              "aria-label",
              `Photo selected: ${selectedFile.name}`,
            );
            photoPicker.title = `Photo selected: ${selectedFile.name}`;
            document.querySelector("#form-error").textContent = "";
          }
        });
        async function openMandap() {
          const error = document.querySelector("#form-error");
          error.textContent = "";
          websiteUrl = selectedFile ? null : parseUrl(input.value);
          if (!selectedFile && !websiteUrl) {
            error.textContent = input.value.trim()
              ? "Add a valid http or https link, or choose a photo."
              : "Add a link or choose a photo first.";
            input.focus();
            return;
          }
          const submit = form.querySelector('button[type="submit"]');
          submit.disabled = true;
          form.hidden = true;
          loader.hidden = false;
          intro.setAttribute("aria-busy", "true");
          frameMessage.hidden = true;
          previewWindow.classList.remove("target-visible");
          if (selectedFile) {
            if (photoUrl) URL.revokeObjectURL(photoUrl);
            photoUrl = URL.createObjectURL(selectedFile);
            photo.src = photoUrl;
            photo.hidden = false;
            preview.hidden = true;
            shot.hidden = true;
            try {
              await photo.decode();
            } catch {
              error.textContent =
                "That photo could not be opened. Try another image.";
              form.hidden = false;
              loader.hidden = true;
              intro.setAttribute("aria-busy", "false");
              submit.disabled = false;
              return;
            }
          } else {
            photo.hidden = true;
            shot.hidden = true;
            preview.hidden = false;
            iframeLoaded = false;
            shotRequested = false;
            say("Getting the website ready…");
            const ready = new Promise((resolve) => {
              resolveContentReady = resolve;
              contentReadyTimer = setTimeout(
                () => finishContentReady(false),
                30000,
              );
            });
            preview.src = websiteUrl.href;
            clearTimeout(iframeTimer);
            iframeTimer = setTimeout(() => {
              if (!iframeLoaded) createScreenshot();
            }, 6500);
            const loaded = await ready;
            if (!loaded) {
              error.textContent =
                "The website preview could not be loaded. Check the link and try again or photo of the website.";
              form.hidden = false;
              loader.hidden = true;
              intro.setAttribute("aria-busy", "false");
              submit.disabled = false;
              return;
            }
          }
          say("Your offering is ready. Everything is coming together…");
          intro.classList.add("leaving");
          await wait(820);
          intro.hidden = true;
          loader.hidden = true;
          intro.setAttribute("aria-busy", "false");
          app.classList.remove("intro-active");
          await animateMandapEntrance();
          const welcome = ornaments.find(
            (entry) => entry.item.name === "welcome",
          );
          if (welcome) {
            welcome.img.classList.add("welcome-out");
            await wait(400);
            welcome.img.remove();
          }
          previewWindow.classList.add("target-visible");
          await wait(800);
          band.hidden = false;
          requestAnimationFrame(() => band.classList.add("visible"));
          say("Choose a playful ritual from the band below.");
        }
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          openMandap();
        });
        function showMedia(element) {
          element.hidden = false;
          element.classList.add("visible");
          const fromLeft = Math.random() < 0.5;
          element.style.setProperty("--float-left", fromLeft ? "4%" : "auto");
          element.style.setProperty("--float-right", fromLeft ? "auto" : "4%");
          element.style.setProperty("--float-y", `${28 + Math.random() * 30}%`);
        }
        function hideMedia(element) {
          element.pause?.();
          element.classList.remove("visible", "aarti-centre");
          element.hidden = true;
          element.style.removeProperty("--float-left");
          element.style.removeProperty("--float-right");
          element.style.removeProperty("--float-y");
        }
        function armPlacement(kind) {
          placementKind = kind;
          placementLayer.classList.add("armed");
          say(
            kind === "tika"
              ? "Click the preview to place your tika."
              : "Click the preview to hang your nimbu-mirchi.",
          );
        }
        function togglePeople() {
          const peopleButton = band.querySelector('[data-ritual="people"]');
          const buttons = [...band.querySelectorAll(".ritual-option")];
          if (peopleOnStage) {
            if (animation.classList.contains("people-leaving")) return;
            peopleOnStage = false;
            animation.classList.add("people-leaving");
            peopleButton.setAttribute("aria-pressed", "false");
            say("The group is heading off stage.");
            setTimeout(() => {
              peopleEnsemble.hidden = true;
              animation.classList.remove(
                "active",
                "people-run",
                "people-leaving",
              );
              band.classList.remove("busy");
              buttons.forEach((button) => (button.disabled = false));
              ritualBusy = false;
              say("The stage is yours again.");
            }, 1850);
            return;
          }
          if (ritualBusy) return;
          ritualBusy = true;
          peopleOnStage = true;
          animation.classList.add("active", "people-run");
          band.classList.add("busy");
          buttons.forEach((button) => {
            if (button !== peopleButton) button.disabled = true;
          });
          peopleEnsemble.hidden = false;
          peopleButton.setAttribute("aria-pressed", "true");
          say("A little more company on stage.");
        }
        placementLayer.addEventListener("click", (event) => {
          if (!placementKind) return;
          const bounds = placementLayer.getBoundingClientRect(),
            asset = document.createElement("img"),
            kind = placementKind;
          asset.className = `placed-ritual ${kind === "tika" ? "tika-sticker" : "nimbu-sticker"}`;
          asset.src =
            kind === "tika" ? "assets/tika.png" : "assets/nimb-mirchi.png";
          asset.alt = "";
          asset.style.left = `${((event.clientX - bounds.left) / bounds.width) * 100}%`;
          asset.style.top = `${((event.clientY - bounds.top) / bounds.height) * 100}%`;
          placementLayer
            .querySelector(
              `.placed-ritual.${kind === "tika" ? "tika-sticker" : "nimbu-sticker"}`,
            )
            ?.remove();
          placementLayer.append(asset);
          placementKind = "";
          placementLayer.classList.remove("armed");
          say(kind === "tika" ? "Tika placed." : "Nimbu-mirchi placed.");
        });
        async function performRitual(kind) {
          if (kind === "people") {
            togglePeople();
            return;
          }
          if (ritualBusy) return;
          if (kind === "tika" || kind === "nimbu") {
            armPlacement(kind);
            return;
          }
          ritualBusy = true;
          animation.classList.add("active");
          band.classList.add("busy");
          const buttons = [...band.querySelectorAll(".ritual-option")];
          buttons.forEach((button) => (button.disabled = true));
          try {
            if (kind === "aarti") {
              say("Aarti le lo!");
              animation.classList.add("aarti-run");
              gif.hidden = false;
              gif.classList.add("visible");
              gif.style.removeProperty("--float-left");
              gif.style.removeProperty("--float-right");
              gif.style.removeProperty("--float-y");
              await wait(10000);
              hideMedia(gif);
              animation.classList.remove("aarti-run");
              say("Aarti complete.");
            }
          } finally {
            ritualBusy = false;
            animation.classList.remove(
              "active",
              "aarti-run",
              "people-run",
              "people-leaving",
            );
            band.classList.remove("busy");
            buttons.forEach((button) => (button.disabled = false));
          }
        }
        band
          .querySelectorAll("[data-ritual]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              performRitual(button.dataset.ritual),
            ),
          );
        app.classList.add("intro-active");
        say("Add a website link or photo to begin.");
        const parallaxOrnaments = ornaments.map((entry) => entry.img);
        app.addEventListener("pointermove", (event) => {
          if (
            event.pointerType === "touch" ||
            matchMedia("(prefers-reduced-motion: reduce)").matches
          )
            return;
          if (frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            const px = (event.clientX / innerWidth - 0.5) * -34,
              py = (event.clientY / innerHeight - 0.5) * -28;
            artStage.style.setProperty("--bgx", `${px * 0.18}px`);
            artStage.style.setProperty("--bgy", `${py * 0.18}px`);
            parallaxOrnaments.forEach((img) => {
              const depth = Number(img.dataset.depth);
              img.style.setProperty("--offset-x", `${px * depth}px`);
              img.style.setProperty("--offset-y", `${py * depth}px`);
            });
          });
        });
        app.addEventListener("pointerleave", () => {
          artStage.style.setProperty("--bgx", "0px");
          artStage.style.setProperty("--bgy", "0px");
          parallaxOrnaments.forEach((img) => {
            img.style.setProperty("--offset-x", "0px");
            img.style.setProperty("--offset-y", "0px");
          });
        });
        addEventListener("beforeunload", () => {
          if (photoUrl) URL.revokeObjectURL(photoUrl);
        });
      })();
    </script>
  </body>
</html>
